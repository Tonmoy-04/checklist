[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mychecklist"
version = "0.1.0"
description = "A local-first Windows desktop task planner."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "customtkinter==5.2.2",
    "plyer==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pyinstaller==6.11.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
